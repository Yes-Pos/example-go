name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Contoh ini memakai SDK dari proxy, jadi sekali seminggu dicek lagi agar
  # rilis SDK yang baru tidak diam-diam membuatnya tidak bisa dibangun.
  schedule:
    - cron: '0 2 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "File berikut belum diformat. Jalankan 'gofmt -w .':"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
